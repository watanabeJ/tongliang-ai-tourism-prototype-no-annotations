<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铜梁旅游商户端 - 注册</title>
  <link rel="stylesheet" href="merchant.css?v=20260828-54">
</head>
<body>
  <main class="prototype-stage">
    <section class="phone-shell" aria-label="铜梁旅游商户端注册原型">
      <div class="app-screen">
        <div class="status-bar"><span>15:30</span><span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
        <header class="app-header">
          <button class="icon-button" type="button" data-back="login" aria-label="返回登录" title="返回"><i data-lucide="arrow-left"></i></button>
          <div class="app-header-copy"><strong>商户注册</strong><small>运营二维码邀请</small></div>
          <span class="header-placeholder"></span>
        </header>
        <div class="page-content registration-content">
          <section class="registration-heading">
            <span><i data-lucide="scan-line"></i></span>
            <div><h1>创建商户账号</h1><p>设置手机号和登录密码</p></div>
          </section>
          <form class="registration-form panel" data-register-form novalidate>
            <label class="field">
              <span class="field-label">手机号</span>
              <input class="input" name="phone" inputmode="numeric" autocomplete="username" maxlength="11" placeholder="请输入11位手机号" aria-label="注册手机号" required>
            </label>
            <label class="field">
              <span class="field-label">设置密码</span>
              <span class="input-wrap"><input class="input with-action" id="register-password" name="password" type="password" autocomplete="new-password" maxlength="20" placeholder="请输入6至20位密码" aria-label="设置密码" required><button class="input-action" type="button" data-toggle-password="register-password" aria-label="显示密码" title="显示密码"><i data-lucide="eye"></i></button></span>
            </label>
            <label class="field">
              <span class="field-label">确认密码</span>
              <span class="input-wrap"><input class="input with-action" id="register-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="20" placeholder="请再次输入密码" aria-label="确认密码" required><button class="input-action" type="button" data-toggle-password="register-password-confirm" aria-label="显示密码" title="显示密码"><i data-lucide="eye"></i></button></span>
            </label>
            <button class="button primary block" type="submit" data-ann="register-submit">完成注册</button>
          </form>
          <div class="registration-login"><span>已有账号</span><button class="text-button" type="button" data-route="login" data-ann="back-to-login">返回登录</button></div>
        </div>
        <div class="toast" data-toast-root role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script src="assets/lucide.min.js"></script>
