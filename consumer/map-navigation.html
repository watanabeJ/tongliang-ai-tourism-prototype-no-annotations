        <span class="poi-navigation-grip" aria-hidden="true"></span>
        <h1 data-navigation-name>目的地</h1>
        <p data-navigation-address>重庆市铜梁区玄天湖周边</p>

          </button>
        </div>
      </section>
    </div>
  </section>
</main>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const name = params.get('name') || '目的地';
  const address = params.get('address') || '重庆市铜梁区玄天湖周边';
  document.querySelector('[data-navigation-name]').textContent = name;
  document.querySelector('[data-navigation-address]').textContent = address;
  document.querySelector('.poi-navigation-back')?.addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = 'plan.html';
  });
})();
</script>
