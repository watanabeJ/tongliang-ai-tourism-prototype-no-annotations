      "contentMarkdown": "### 业务含义\n\n计划首页顶部的“中 / EN”按钮用于切换当前会话的界面语言，并决定切换后的新 AI 回复语言。\n\n### 交互规则\n\n- 点击“中 / EN”后，在中文与英文界面之间切换；页面固定文案包括导航、按钮、状态、空状态、错误提示、操作反馈、帮助提示、灵感跑马灯和附近服务面板文案。\n- 切换为英文时，首页三行跑马灯胶囊全部显示对应英文文案；切回中文时恢复中文文案，主题 key、排序、点击入口和当前滚动位置保持不变。\n- 切换为英文时，附近服务面板显示“Nearby services / Food / Stay / Explore / Shop / Parking / Restroom”；切回中文时恢复原文，分类编码和点击后的固定提示词保持不变。\n- 切换为英文时，智能体添加强制规则，新生成的回复只能使用英文。\n- 已经显示的历史 AI 消息不因切换语言而重新翻译；切换完成后，新发送的消息由 AI 按当前页面语言组织回复。\n- 用户可以使用中文或英文输入；英文界面下，智能体仍只能以英文回复，不因用户输入语言改变。\n- 景点、商户、商品、活动名称和地址默认保留中文原名；英文界面可在中文原名后增加英文解释或类别说明，不强制创造未经确认的官方英文名。\n- 价格、电话、日期和地址中的数字及格式不因语言切换改变业务含义。\n- 语言偏好只在本次用户会话内保持，不跨设备或跨登录会话长期保存；每次重新进入产品时恢复中文。\n- 切换语言不改变当前对话、历史消息、心愿单、定位或页面路由状态。\n\n### 页面流转\n\n- 来源：计划首页顶部语言按钮；目标：当前页面中文/英文显示状态、跑马灯和附近服务面板文案及后续 AI 回复语言。",

      "title": "灵感跑马灯",
      "contentMarkdown": "### 业务含义\n\n首页通过三行灵感跑马灯展示可直接发起 AI 对话的游玩话题。\n\n### 数据来源与展示\n\n- 跑马灯主题列表由运营后台配置，包含展示文案、提示词、排序、启用状态、有效期。\n- 前端固定展示三行；最多 20 条跑马灯胶囊形态。顺序按照后台配置的自然数从上到下、从左到右依次显示。\n- 主题过期或加载失败时加载最近一次有效主题快照。\n\n### 点击效果\n\n- 点击胶囊后才将该灵感写入当前会话，并展开半屏对话面板。\n- AI 回复中涉及商品或商户时，统一使用截图样式的横向推荐卡片：展示图片、名称和类型/地址摘要，多张卡片支持左右滑动；卡片底部仅保留定位与加入心愿单两个圆形图标。\n\n### 页面流转\n\n- 来源：首页灵感跑马灯；目标：当前会话中的主题对话、AI 结果或后续推荐内容。\n\n### 2026-09-08 已确认增量：先回答、后追问与真实智能体\n\n- 继承本标注此前的数据配置与入口规则；新回复不再使用先提问、固定轮次收集信息、最后展示预设结果的流程。\n- 点击弹幕后发送其独立提示词；输入框提问、后续补充和已配置轮播主题统一通过本地服务端调用 deepseek-v4-flash。\n- 先给已有信息支持的实质答案，再按需在末尾附上一个关键追问；信息已经足够时不追问。缺少关键对象而无法作答时才先最小澄清，不重复询问已知条件。\n- 以发送时的界面语言生成新回复；已有历史消息不翻译。仅发送当前会话最近最多24条、合计24000字符的有效上下文，不发送其他历史会话、心愿单、定位或文件。\n- 支持生成中、停止、失败重试；失败不会用模拟内容替代。切换历史会话、新建或清空对话会停止旧请求，迟到的回复不写入新会话。\n- 密钥仅由本地服务端读取，使用Windows账户加密保存于网页目录之外；网页不包含密钥。对话文本将发送给用户指定的模型服务。\n- 当前仍使用本地运营配置快照；真实旅游知识库、地图路线、停车余位、票务、营业状态及推荐实体绑定尚未接入。真实回复先展示文字，不把模型提到的未知实体自动生成可操作推荐卡片；上述推荐卡片规则待实体知识接入后沿用。模型回答不等于已核验事实。\n\n### 2026-09-08 后续增量：场景编排、实体引用与工具\n\n- 本增量继承上方先回答、后追问规则，更新此前“推荐实体绑定尚未接入”的边界：按讲解、推荐、行程、实时查询、附近和修改六种场景组织回答。\n- 先展示实质答案，再展示本轮工具来源与已有实体卡片，最后按需附一个追问；已确认条件不重复询问。服务端根据当前问题选择工具并行查询，再将结果供模型生成答案。\n- 引用当前项目39条实体资料快照，仅本轮检索命中的实体可以生成详情、心愿单和地图操作；不把演示价格、距离、营业状态或坐标当作实时数据。\n- 天气使用Open-Meteo，显示明确日期、参考区域、预报温度、降雨概率和查询时间。默认是铜梁城区参考区域，不冒充设备所在位置。\n- 地图卡片进入独立真实底图页面，可拖动缩放并打开高德核对地点。未配置高德Web服务Key时只提供搜索入口，不声称已取得坐标、路线或实时路况；配置后返回待核对的GCJ-02候选，不直接绘制到WGS84底图。\n- 网页搜索接入Tavily，默认使用已联调的免密钥限额通道；配置服务端Key后使用认证通道。来源摘要、发布时间或未知、查询时间分别展示，失败或限流明确提示，不编造搜索成功。\n- 本增量更新上方定位边界：只有用户点击一次性定位授权后才获取真实设备位置，用于当前会话最多10分钟内的附近请求或天气查询；不持久化坐标，不使用旧演示定位。搜索发送本轮精简查询，天气发送约1公里精度的坐标，地图检索发送地点名称；不向这些工具发送整段历史对话或模型密钥。\n- 当前不提供站内道路路线计算、实时停车余位、订票和库存核验。已有卡片是项目资料而非实时事实，网页摘要也不等于已核验公告。\n\n### 2026-09-08 再次增量：清晰排版、正文蓝链与高德查询\n\n- 继承上方先回答、后追问和工具事实边界。本轮参考用户提供的攻略形式组织版式，不将示例中的价格、车程、开放时间和“无折返”当作已核验资料。\n- 新回复按内容使用标题、小标题、短段落、列表、重点加粗及少量表情符号。完整行程包含路线概览、已知条件或假设、建议时段、用餐与休息安排和实用提醒；简单问答不强套全天行程。\n- 正文与追问里凡是能匹配到已启用卡片名称或无歧义别名的内容，都显示蓝色可点击文字，进入同一实体的卡片详情页；不受底部最多3张推荐卡片限制。较长名称优先匹配，同名歧义或无对应资料时保持普通文字。蓝色链接仅代表存在项目卡片，不代表实时事实核验。\n- 旧回复不重新生成、不改写原文；已有分段和【小标题】兼容展示，匹配到的名称同样增加链接。模型输出的HTML、图片和自定义链接不直接执行，只由受控渲染器生成已知详情链接。\n- 推荐卡片定位与收藏按钮统一为44×44像素圆形点击区域，内部图标22×22像素居中；收藏状态支持读屏，保留原有收藏/取消与定位操作。\n- 更新上方高德配置边界：本次已使用用户提供的Web服务Key配置站内地点查询，Key仍仅保存在网页目录外的Windows账户加密文件中。真实接口已取得安居古城候选。\n- 高德结果只保留与项目名称相符的候选，排除名称不同的相似店铺；找不到匹配时明确提示，不把其他商户当作当前卡片目的地。候选仍需用户核对，底图不冒充精确商户定位，不等于已提供道路路线计算。\n\n### 2026-09-08 后续确认：推荐卡片紧凑展示\n\n- 继承上述链接和操作规则；卡片内“项目已有资料 · 营业/价格未实时核验”这一行改为该实体记录中的地址。与地图卡片共用蓝色导航箭头、单行地址和超长省略样式，点击地址进入对应地图页；缺少地址时显示“地址待补充 / Address not supplied”，不虚构位置。\n- 本次明确调整此前按钮尺寸：定位、收藏圆形按钮从44×44缩小为32×32，内部图标从22×22缩小为18×18并保持居中；减少底部内边距。图片和卡片宽度不变，通过地址单行展示及按钮缩小降低整体卡片高度。\n- 移除卡片里的重复提示不改变本地资料、实时核验和地图候选的事实边界，回复规则和详情来源说明继续保留。\n\n### 2026-09-08 后续确认：定位按钮直达边走边耍\n\n- 推荐卡片底部定位图标改为直接跳转“边走边耍”地图页（explore.html），不再通过独立的推荐地点地图页中转。\n- 本次仅改变底部定位按钮入口；卡片地址行仍进入该实体的地图核对页，卡片主体/正文链接仍进入详情，收藏操作和紧凑样式保持不变。此跳转不表示已取得商户真实坐标，不添加虚构精确定位。\n\n### 2026-09-08 后续确认：不展示网页检索来源栏\n\n- 游客端回复不再展示“网页检索来源（摘要，不等于已核验事实）”折叠栏，包括来源列表、摘要和查询时间；中英文以及重新展示的历史回复统一生效。\n- 仅调整成功搜索结果的展示，后台搜索、模型使用搜索证据和原始结果保存保持不变；搜索失败/不可用提示、天气展示、正文、追问及推荐卡片不受影响。未核验信息仍不得冒充已核验事实。\n\n### 2026-09-08 后续确认：推荐卡片不展示分组标题\n\n- 移除“匹配到的已有卡片 / Matching project cards”分组标题，回复下方直接展示卡片；中英文和重新展示的历史回复统一生效。卡片内容、滑动、详情、定位、地址和收藏操作保持不变。\n\n### 2026-09-08 后续确认：多卡片收藏同步与红心样式\n\n- 收藏状态立即写入，不再等待340毫秒飞入动画结束。动画与数据更新分离，连续收藏不同对象可分别生效；快速重复点击同一对象按当前状态切换，不重复添加或延迟恢复。\n- 心愿单更新时同步当前页面全部智能体卡片收藏按钮，包括同一实体在不同历史回复中的重复卡片；只更新按钮，不重建整段对话，保留横向滚动位置和键盘焦点。\n- 选中状态仅将内部心形填充红色，圆形按钮保持白底和原边框；取消后恢复空心。按钮大小、定位、详情及其他卡片布局不变，中英文无障碍状态同步更新。\n\n### 2026-09-08 后续确认：只有完整卡片详情才生成蓝色链接\n\n- 更新此前“所有目录实体可生成链接”的规则：只有已配置完整卡片详情（hasDetailPage=true）的实体名称才显示蓝色链接，直接进入已有product-detail.html对应记录，不提供通用agent-entity.html中间资料页。\n- “玄天湖观景台”等仅有简要介绍的地点保留为普通文字，不生成占位推荐卡片；资料仍可供模型回答参考，不虚构对应完整详情，也不借用其他景点的详情页。\n- 服务端返回推荐卡片与前端渲染均执行此约束，中英文和重新展示的历史回复同步生效；地图候选页没有完整详情时不展示“查看项目资料”跳转。已有有效卡片的定位、地址、详情、收藏样式与交互保持不变。\n\n### 2026-09-08 后续确认：网上资料补充吃住游购卡片\n\n- 继承完整详情才生成蓝链的规则。增加12张有来源的完整卡片，吃住游购各3张，其中安居古城、奇彩梦园复用已有ID并升级完整详情；有效完整卡片从20张增加到32张。玄天湖观景台等未补全记录仍不生成占位详情或蓝链。\n- 新资料统一维护于data/researched-cards.js，服务端目录与product-detail.html共享；researchRef直接选中完整详情，不增加中间页。新卡片继续支持正文蓝链、收藏、地图地址查询和边走边耍入口。\n- 详情展示记录地址、简介、特色、资料来源、来源发布日期（有则展示）及整理日期2026-09-08。无实拍图时使用明确标注“分类示意·非场所实拍”的封面，不挪用其他店铺照片。\n- 本批资料不是已核验的实时营业信息；不编造价格、房态、电话、坐标或当前活动。缺少精确门牌的区域地址明确标注，地图仍通过现有高德候选查询核对，不添加模拟坐标。政府页面转载的旧线路按历史资料处理，来源日期和出行提醒同时传入模型。\n- 回复区不恢复搜索来源折叠栏；本批来源仅在详情中查阅。新卡片不展示无实际目标的店铺入口，不提供购买或预订流程。\n\n### 2026-09-08 后续确认：隐藏内部卡片清单与地图空结果提示\n\n- 回复不展示“已展示卡片 / Shown cards: …”内部清单；停止将该清单拼入模型历史正文，历史回复渲染和再次发送历史时过滤已有清单。卡片指代继续使用独立previousEntityIds，不影响“第二家”等追问。\n- 中英文回复不展示地图empty状态的“地图检索：没有匹配结果”提示；工具结果保留，卡片、正文蓝链、收藏和地图入口不变。其他工具状态和必要事实边界不变，不将空结果伪装为查询成功。\n- 模型提示词同步约束不复述上述内部标签。仅清理显示与请求历史，不删除用户历史记录。\n\n### 2026-09-08 后续确认：统一卡片收藏与咨询按钮\n\n- 地图卡片的咨询图标使用简笔线框对话气泡；会话推荐卡片在收藏按钮右侧新增相同图标，顺序为地图、收藏、咨询。操作按钮32×32，内部图标18×18。\n- 地图卡片收藏与会话卡片保持相同白底圆框、红色心形描边；收藏后仅心形填红，取消恢复空心，不再整圆填红。收藏更新同步相同ID的地图和会话按钮及aria-pressed状态。\n- 地图与会话卡片的咨询入口复用真实智能体发送流程，以点击实体的完整名称发起咨询、展开半屏会话，先介绍已有资料再按需追问，不再由地图按钮插入固定模拟追问。\n- 中文/英文咨询使用当前界面语言；保留输入框及键盘输入框未发送草稿，正在生成时沿用重复发送保护。正文详情链接、地图入口、卡片尺寸及原有收藏数据不变。\n\n### 2026-09-09 后续确认：隐藏地图候选提示条\n\n- 会话回复不再展示地图ok或handoff_only状态提示及其“查看地图”链接，中英文及历史回复统一生效。此前empty隐藏规则继续保留，其他工具错误说明不变。\n- 仅移除重复提示条，地图查询与证据保留，卡片地址和卡片自身的地图入口继续可用。\n\n### 2026-09-09 后续确认：移除会话定位授权展示\n\n- 回复下方不再展示“尚未使用设备位置；授权后可细化附近查询”和“一次性授权定位”按钮，中英文及历史回复统一生效。\n- 仅移除展示，不自动取得或默认授权设备位置；保留底层显式授权机制、位置有效期校验、地图与卡片入口，不修改历史数据或needsLocation证据字段。\n\n### 2026-09-09 后续确认：首页地图入口图标统一\n\n- 首页“进入边走边耍地图”改为与问答卡片相同的简笔定位/导航图标；嵌入地图切换时动态更新也使用同款图标，点击跳转逻辑不变。\n\n### 2026-09-09 后续确认：首页与地图返回图标按卡片顺序统一\n\n- 首页进入边走边耍使用卡片第一个定位图标；边走边耍返回问答页使用卡片第三个简笔咨询气泡图标。原有页面跳转与语言状态保持不变。",

      "contentMarkdown": "### 业务含义\n\n说明轮播主图承载运营推荐内容，并作为主题对话入口。\n\n### 数据来源与展示\n\n- 主图、提示词、有效时间和启用状态在后台配置；用户点击后，根据提示词进行回复。\n- 当前原型中文展示 9 张主图，英文展示独立配置的 6 张主图；每种语言默认最多显示 10 张图，超过 10 张时按配置顺序取前 10 张；排版中间默认显示第 2 至第 3 张，两侧露出相邻卡片作为可滑动提示。\n- 后台配置更新后，前端重新读取有效配置；加载失败时使用最近一次有效轮播配置。\n\n### 点击与滑动效果\n\n- 轮播图自动从右向左循环轮播，末张与首张连续衔接；当前原型每 3 秒移动一个图位。\n- 用户可以左右滑动轮播图，每次滑动一个图位，可左右循环滑动。手动拖动时暂停自动轮播，松手后等待 3 秒恢复；滑动不触发卡片点击，纵向滑动仍可滚动页面。\n- 页面隐藏时暂停自动轮播，返回后恢复；仅有一张图片时静态展示。系统开启“减少动态效果”时关闭自动轮播，保留手动切换。\n- 点击主图后，根据提示词进行对话，并将对话面板展开至半屏。\n- 示例的玄天湖、周末组合和环湖骑行等主题进入统一追问流程；关联商户/商品动作可继续进入详情、地图或心愿单。\n- 对话中的商品/商户推荐卡片右下角只保留定位和加入心愿单两个图标；定位图标为蓝色 pin，尺寸与心愿单图标一致。点击卡片主体进入详情，点击定位进入应用内地图，点击心愿单加入记录；同一对象不得重复加入。\n\n### 页面流转\n\n- 来源：计划页轮播主图；目标：根据提示词进入主题对话及其后续详情、地图或心愿单操作。\n\n### 轮播配置规则\n\n- 轮播主图由后台配置，包含主图、提示词、有效时间和启用状态；用户点击后，根据提示词进行回复。\n- 默认最多显示 10 张图，自动从右向左循环轮播；用户可以左右滑动轮播图，每次滑动一个图位，可左右循环滑动；中间默认显示第 2 至第 3 张，两侧露出相邻卡片作为可滑动提示。配置更新按整体有效快照替换，失败时使用最近一次有效轮播配置。\n\n### 中英文配置与切换\n\n- 中英文分别配置主图、图中文字、顺序和主题绑定；两套内容的数量、图片和排序可以不同。英文界面使用英文图片文案，不沿用带中文宣传文字的主图。\n- 切换语言时整组替换主图、图中文字、无障碍标签及循环衔接的副本，保留各语言的浏览位置和自动/手动轮播能力；不修改已有对话和草稿。\n- 顶部首页标题同步切换“在铜梁 / In Tongliang”，地图模式同步切换“边走边耍 / Live guide”。\n- 兜底配置只允许使用同语言内容；英文配置缺失时显示英文空状态，图片加载失败时显示当前语言的占位提示，不回退为中文主图。\n- 当前使用 feature-carousel-content.js 中的本地分语言配置快照演示，英文采用另一组现有照片叠加英文文案；真实后台发布、有效期校验和远端快照加载尚未接入。",
